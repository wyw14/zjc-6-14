<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻牌配对小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🃏 翻牌配对小游戏</h1>
    
    <div class="game-info">
      <div class="info-item">
        <span class="label">⏱️ 用时</span>
        <span id="timer" class="value">00:00</span>
      </div>
      <div class="info-item">
        <span class="label">👆 步数</span>
        <span id="moves" class="value">0</span>
      </div>
      <div class="info-item">
        <span class="label">✅ 已配对</span>
        <span id="matched" class="value">0/8</span>
      </div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <div class="controls">
      <button id="restartBtn" class="btn btn-primary">🔄 重新开始</button>
      <button id="leaderboardBtn" class="btn btn-secondary">🏆 排行榜</button>
      <button id="settingsBtn" class="btn btn-secondary">⚙️ 设置</button>
    </div>

    <div id="winModal" class="modal hidden">
      <div class="modal-content">
        <h2>🎉 恭喜通关！</h2>
        <p>你的成绩：<span id="finalTime">00:00</span></p>
        <p>总步数：<span id="finalMoves">0</span></p>
        <div class="input-group">
          <label for="playerName">输入你的名字：</label>
          <input type="text" id="playerName" placeholder="匿名玩家" maxlength="10">
        </div>
        <button id="submitScoreBtn" class="btn btn-primary">提交成绩</button>
        <button id="playAgainBtn" class="btn btn-secondary">再玩一次</button>
      </div>
    </div>

    <div id="leaderboardModal" class="modal hidden">
      <div class="modal-content">
        <h2>🏆 排行榜</h2>
        <ol id="leaderboardList" class="leaderboard-list"></ol>
        <button id="closeLeaderboardBtn" class="btn btn-secondary">关闭</button>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <h2>⚙️ 游戏设置</h2>
        
        <div class="setting-group">
          <div class="setting-label">
            <span>🔊 音效</span>
            <label class="switch">
              <input type="checkbox" id="soundEnabled">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-label">
            <span>🔈 音量</span>
            <span id="volumeValue">70%</span>
          </div>
          <input type="range" id="soundVolume" min="0" max="100" value="70" class="range-slider">
        </div>

        <div class="setting-group">
          <div class="setting-label">
            <span>✨ 动画强度</span>
          </div>
          <div class="animation-buttons">
            <button type="button" class="anim-btn" data-level="0">关闭</button>
            <button type="button" class="anim-btn" data-level="1">弱</button>
            <button type="button" class="anim-btn" data-level="2">中</button>
            <button type="button" class="anim-btn" data-level="3">强</button>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-label">
            <span>🌙 深色模式</span>
            <label class="switch">
              <input type="checkbox" id="darkMode">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="setting-actions">
          <button id="saveSettingsBtn" class="btn btn-primary">保存设置</button>
          <button id="closeSettingsBtn" class="btn btn-secondary">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
